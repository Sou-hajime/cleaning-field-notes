function reportLink(target,download=false){return apiBase()+cpath()+'/report/'+target+(download?'?download=1':'')}
function openReport(target){window.open(reportLink(target),'_blank','noopener')}
function renderList(){const c=S.contract,final=S.records.filter(r=>r.status==='final'),drafts=S.records.filter(r=>r.status==='draft');$('#app').innerHTML='<section class="hero"><div><p class="eyebrow">FIELD NOTES / 清掃記録</p><h1>今日の清掃を、記録する。</h1><p class="sub">写真と数字を残すだけで、提出する日報ができあがります。</p></div><button class="btn primary" onclick="startEntry()">'+icon('plus')+'日報をつける</button></section>'+(S.success?'<div class="success" role="status"><strong>'+icon('check')+' 第'+S.success.number+'回の'+(S.success.status==='draft'?'下書きを保存しました':'日報を保存しました')+'</strong><p>'+(S.success.status==='draft'?'一覧から入力を再開できます。':'写真つきの日報を作成し、頭紙にも反映しました。')+'</p></div>':'')+(c?'<div class="panel contractbar"><span class="site-icon">'+icon('pin')+'</span><div class="selectwrap"><label for="contractSelect">記録する現場</label><select id="contractSelect" onchange="selectContract(this.value)">'+S.contracts.map(x=>'<option value="'+e(x.id)+'" '+(x.id===c.id?'selected':'')+'>'+e(x.name)+'</option>').join('')+'</select></div><div class="period">実施期間<strong>'+(c.start?e(c.start.replaceAll('-',' / ')):'開始日未設定')+' — '+(c.end?e(c.end.replaceAll('-',' / ')):'終了日未設定')+'</strong></div><button class="btn small" onclick="go(\'settings\')">現場の情報を編集</button></div>':'<div class="newhint">日報をつける前に、清掃する場所と作業所名を一度登録してください。<button class="btn small" onclick="go(\'new\')">新しい現場を登録 '+icon('arrow')+'</button></div>')+'<section class="stats"><div class="stat"><div class="cap">'+icon('check')+'保存した日報</div><div class="num">'+final.length+'<span>/ 30 回</span></div><div class="progress"><b style="width:'+final.length/30*100+'%"></b></div></div><div class="stat"><div class="cap">'+icon('bag')+'ゴミ袋の合計</div><div class="num">'+final.reduce((s,r)=>s+r.bags,0)+'<span>袋</span></div><small>保存済みの日報を集計</small></div><div class="stat"><div class="cap">'+icon('edit')+'入力途中</div><div class="num">'+drafts.length+'<span>回</span></div><small>下書きは提出用に含みません</small></div></section><section class="panel"><div class="sectiontop"><h2>30回の作業記録</h2><div class="legend"><span><i class="dot done"></i>保存済み</span><span><i class="dot draft"></i>下書き</span><span><i class="dot"></i>未入力</span></div></div><div class="roundgrid">'+Array.from({length:30},(_,i)=>{const n=i+1,r=S.records.find(r=>r.number===n);return (n===1||n===16?'<div class="rounddivider">'+(n===1?'1枚目：第1〜15回':'2枚目：第16〜30回')+'</div>':'')+'<button class="round '+e(r?.status||'')+'" onclick="'+(r?'go(\'detail\','+n+')':'startEntry('+n+')')+'" aria-label="第'+n+'回 '+(r?.status==='final'?'保存済み':r?'下書き':'未入力')+'"><span>第 '+n+' 回</span><small>'+(r?.date?e(r.date.slice(5).replace('-',' / ')):r?'下書き':'＋ 記録')+'</small></button>'}).join('')+'</div><p class="hint">'+icon('file')+'各回をタップして、日報の確認・入力・修正ができます。</p></section><div class="bottomgrid"><section class="panel"><div class="sectiontop"><h2>最近の記録</h2><span class="sub">最新3件</span></div>'+(S.records.length?S.records.toSorted((a,b)=>b.updatedAt.localeCompare(a.updatedAt)).slice(0,3).map(r=>'<div class="recent"><span class="count">'+r.number+'</span><div><strong>'+e(dateLabel(r.date))+'</strong><small>'+ (r.status==='draft'?'下書き':'作業者 '+r.workers+'名 ・ ゴミ袋 '+r.bags+'袋')+'</small></div><button class="btn small" onclick="go(\'detail\','+r.number+')">確認 '+icon('arrow')+'</button></div>').join(''):'<div class="empty">'+icon('leaf')+'最初の日報をつけると、ここに表示されます。</div>')+'</section><section class="panel export"><h2>'+icon('file')+' 提出用の帳票</h2><p>頭紙は15回ずつの2ページ。<br>各回の写真つき日報も、まとめて印刷できます。</p><div class="stack"><button class="btn small" '+(!c?'disabled':'')+' onclick="openReport(\'cover\')">頭紙を確認</button><button class="btn small" '+(!c?'disabled':'')+' onclick="openReport(\'all\')">'+icon('file')+'一式を印刷・PDF保存</button></div><p style="margin-bottom:0;font-size:10px">A4縦 ／ 2ページ＋保存した回数分の日報</p></section></div>';S.success=null}
function field(label,name,value,type='text',extra=''){return '<label class="field"><span>'+label+'</span><input name="'+name+'" type="'+type+'" value="'+e(value??'')+'" '+extra+'></label>'}
function renderEntrySetup(){S.view='entry';$('#app').innerHTML='<div class="formwrap"><div class="formhead"><div><p class="eyebrow">現場で記録</p><h1>記録する現場がまだありません</h1><p class="sub">日報をつけるには、最初に清掃場所と作業所名の登録が必要です。</p></div></div><section class="panel"><div class="stephead"><span class="stepnum">01</span><h2>最初に一度だけ、現場を登録</h2></div><p>清掃する場所・作業所名・実施期間を登録すると、その現場の第1〜30回の日報を作成できます。</p><p class="notearea">登録した情報は、提出する「作業日報綴り」の頭紙に使います。</p><div class="stack" style="margin-top:20px"><button class="btn primary" onclick="go(\'new\')">'+icon('plus')+'新しい現場を登録</button><button class="btn" onclick="go(\'list\')">日報一覧へ</button></div></section></div>';}
function renderSettings(fresh=false){S.editingNew=fresh||!S.contract;const c=S.editingNew?defaults:S.contract;$('#app').innerHTML='<div class="formwrap"><div class="formhead"><div><p class="eyebrow">現場の準備</p><h1>'+(S.editingNew?'新しい現場を登録':'現場の情報を編集')+'</h1><p class="sub">'+(S.editingNew?'清掃する場所を登録して、30回分の日報を準備します。':'この現場の頭紙に載せる情報を変更します。')+'</p></div></div><form id="settingsForm"><section class="panel step"><div class="stephead"><span class="stepnum">01</span><h2>清掃する場所と作業所</h2></div><div class="fields"><div class="full">'+field('現場の名前','name',c.name,'text','required maxlength="180" placeholder="例：○○公園の清掃"')+'</div><div class="full">'+field('頭紙の帳票名','title',c.title,'text','required maxlength="180"')+'</div>'+field('作業範囲','area',c.area,'text','required maxlength="180" placeholder="例：○○公園 全域"')+field('作業所名','facility',c.facility,'text','required maxlength="180" placeholder="例：○○工房"')+'</div><p class="notearea">現場の名前はアプリ内の表示に使います。作業範囲・作業所名・帳票名は、提出する頭紙に載ります。</p></section><section class="panel step"><div class="stephead"><span class="stepnum">02</span><h2>実施期間・提出日</h2><small>未定の項目は空欄でOK</small></div><div class="fields">'+field('実施開始日','start',c.start,'date')+field('実施終了日','end',c.end,'date')+field('前期提出日','firstSubmission',c.firstSubmission,'date')+field('後期提出日','lastSubmission',c.lastSubmission,'date')+'</div><p class="notearea">1つの現場につき全30回の日報を作成できます。期間を設定した場合、作業日はその期間内で入力できます。</p></section><div class="savebar"><button type="button" class="btn" onclick="go(\'list\')">戻る</button><button class="btn primary" type="submit">'+icon('check')+(S.editingNew?'現場を登録して日報をつける':'現場の情報を保存する')+'</button></div></form></div>';$('#settingsForm').onsubmit=saveSettings}

async function saveSettings(ev){ev.preventDefault();if(S.saving)return;const f=ev.target;if(!f.reportValidity())return;S.saving=true;f.querySelectorAll('button').forEach(x=>x.disabled=true);const raw=Object.fromEntries(new FormData(f));try{const wasNew=S.editingNew;const c=await api(S.editingNew?'contracts':cpath(),{method:S.editingNew?'POST':'PUT',body:JSON.stringify({...raw,etag:S.contract?.etag})});const ix=S.contracts.findIndex(x=>x.id===c.id);if(ix<0)S.contracts.unshift(c);else S.contracts[ix]=c;S.contract=c;localStorage.setItem('cleaning.activeContract',c.id);S.saving=false;S.dirty=false;toast(wasNew?'現場を登録しました。続けて第1回の日報をつけられます。':'現場の情報を保存しました。');if(wasNew)S.records=[];await go(wasNew?'entry':'list',wasNew?1:undefined,true)}catch(err){setError(err.message)}finally{S.saving=false;f.querySelectorAll('button').forEach(x=>x.disabled=false)}}
function photoCard(kind,title,help){return '<div class="photocard"><div class="phototop">'+title+' <span style="font-size:10px;color:var(--muted);font-weight:400">必須</span></div><div class="photopreview" id="preview-'+kind+'">'+icon('camera')+'<small>写真を撮影・選択</small></div><div class="photobtns"><button type="button" class="btn" onclick="pickPhoto(\''+kind+'\',true)">'+icon('camera')+'撮影する</button><button type="button" class="btn" onclick="pickPhoto(\''+kind+'\',false)">'+icon('photo')+'写真を選ぶ</button></div><p class="photohelp">'+help+'</p><input hidden style="display:none" id="camera-'+kind+'" type="file" accept="image/*" capture="environment" onchange="onPhoto(this,\''+kind+'\')"><input hidden style="display:none" id="file-'+kind+'" type="file" accept="image/*" onchange="onPhoto(this,\''+kind+'\')"></div>'}
async function renderEntry(){let r=S.records.find(x=>x.number===S.number)||{number:S.number,date:today(),startTime:'',endTime:'',workers:'',guides:'',bags:'',status:'draft'};S.record=r;S.photos={};let recovered=false;try{const d=await draftRead();if(d&&(d.etag||null)===(r.etag||null)){r={...r,...d.fields};S.photos=d.photos||{};recovered=true}}catch{}$('#app').innerHTML='<div class="formwrap"><div class="formhead"><div><p class="eyebrow">NEW FIELD NOTE / 現場で記録</p><h1>第 '+S.number+' 回の作業日報</h1><p class="sub">'+e(S.contract.area)+' ／ '+e(S.contract.facility)+'</p></div><button class="btn ghost" onclick="go(\'list\')">'+icon('back')+'一覧へ</button></div>'+(recovered?'<div class="alert">この端末に残っていた入力内容を復元しました。</div>':'')+'<form id="entryForm"><section class="panel step"><div class="stephead"><span class="stepnum">01</span><h2>いつ、作業しましたか？</h2></div><div class="fields"><div class="full">'+field('作業日','date',r.date,'date','required '+(S.contract.start?'min="'+e(S.contract.start)+'" ':'')+(S.contract.end?'max="'+e(S.contract.end)+'"':''))+'</div>'+field('開始時刻','startTime',r.startTime,'time','required')+field('終了時刻','endTime',r.endTime,'time','required')+'</div></section><section class="panel step"><div class="stephead"><span class="stepnum">02</span><h2>人数とゴミ袋</h2></div><div class="fields three">'+[['作業者','workers','名',1],['指導者','guides','名',0],['ゴミ袋','bags','袋',0]].map(([label,name,unit,min])=>'<label class="field"><span>'+label+'</span><div class="unitinput"><input name="'+name+'" type="number" inputmode="numeric" min="'+min+'" max="9999" step="1" required value="'+e(r[name]??'')+'"><i>'+unit+'</i></div></label>').join('')+'</div></section><section class="panel step"><div class="stephead"><span class="stepnum">03</span><h2>写真を2枚、添付する</h2></div><div class="photo-row">'+photoCard('work','作業状況写真','清掃中の様子が分かるように撮影してください。')+photoCard('bags','ごみ袋の写真','袋の個数と、置いた場所・周辺の様子が一緒に分かるように撮影してください。')+'</div><p class="notearea">撮影した写真は、縦横の向きを保って日報に配置します。</p></section><div id="autosave" class="autosave">'+(recovered?'入力内容を復元しました':'保存前に、日時・人数・袋数と写真を確認してください')+'</div><div class="savebar"><button type="button" class="btn" id="draftBtn" '+(S.record.status==='final'?'hidden':'')+' onclick="saveRecord(\'draft\')">下書き保存</button><button type="submit" class="btn primary" id="saveBtn">'+icon('save')+'日報を保存する</button></div></form></div>';for(const kind of ['work','bags'])refreshPhoto(kind);$('#entryForm').onsubmit=ev=>{ev.preventDefault();saveRecord('final')};$('#entryForm').oninput=markDirty;if(recovered)S.dirty=true}
function pickPhoto(kind,camera){$('#'+(camera?'camera-':'file-')+kind).click()}
async function onPhoto(input,kind){const f=input.files?.[0];if(!f)return;try{$('#preview-'+kind).innerHTML='<small>写真を読み込んでいます…</small>';const img=await loadImage(URL.createObjectURL(f),true);const scale=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight));const canvas=document.createElement('canvas');canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);S.photos[kind]=canvas.toDataURL('image/jpeg',.83);refreshPhoto(kind);markDirty()}catch(err){refreshPhoto(kind);toast('この写真を読み込めませんでした。JPEG・PNGの写真か、別の写真でお試しください。')}input.value=''}
function loadImage(src,revoke=false){return new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>{if(revoke)URL.revokeObjectURL(src);resolve(img)};img.onerror=()=>{if(revoke)URL.revokeObjectURL(src);reject(Error('image'))};img.src=src})}
function refreshPhoto(kind){const src=S.photos[kind]||(S.record?.photos?.[kind]?apiBase()+cpath()+'/photo/'+S.number+'/'+kind+'?v='+encodeURIComponent(S.record.updatedAt):null);const box=$('#preview-'+kind);if(box)box.innerHTML=src?'<img src="'+e(src)+'" alt="'+(kind==='work'?'作業状況写真':'ごみ袋の写真')+'"><span class="replace">添付済み</span>':icon('camera')+'<small>写真を撮影・選択</small>'}
function openDraftDB(){if(!dbPromise)dbPromise=new Promise((resolve,reject)=>{const rq=indexedDB.open('cleaning-field-notes',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('drafts');rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error)});return dbPromise}
function draftKey(){return S.contract.id+':'+S.number}
async function draftRead(){const db=await openDraftDB();return new Promise((resolve,reject)=>{const rq=db.transaction('drafts').objectStore('drafts').get(draftKey());rq.onsuccess=()=>resolve(rq.result);rq.onerror=()=>reject(rq.error)})}
async function draftWrite(value,key=draftKey()){const db=await openDraftDB();return new Promise((resolve,reject)=>{const tx=db.transaction('drafts','readwrite');const st=tx.objectStore('drafts');value?st.put(value,key):st.delete(key);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
function markDirty(){S.dirty=true;clearTimeout(draftTimer);draftTimer=setTimeout(()=>persistDraft(),500)}
async function persistDraft(){const form=$('#entryForm');if(!form||!S.contract)return;const payload={fields:Object.fromEntries(new FormData(form)),photos:{...S.photos},etag:S.record?.etag||null};try{await draftWrite(payload);if($('#autosave'))$('#autosave').textContent='入力内容をこの端末に一時保存しました。日報への反映には保存ボタンを押してください。'}catch{if($('#autosave'))$('#autosave').textContent='一時保存できませんでした。画面を閉じる前に、下書き保存してください。'}}
async function saveRecord(status){if(S.saving)return;const form=$('#entryForm');if(status==='final'&&!form.reportValidity())return;if(!navigator.onLine&&!window.CLEANING_DEMO){setError('通信できません。再接続してから保存してください。');await persistDraft();return}const raw={...Object.fromEntries(new FormData(form)),number:S.number,status,etag:S.record?.etag||null};if(status==='final'&&['work','bags'].some(k=>!S.photos[k]&&!S.record?.photos?.[k])){setError('作業状況とごみ袋の写真を、それぞれ1枚ずつ添付してください。');return}S.saving=true;clearTimeout(draftTimer);form.querySelectorAll('button').forEach(b=>b.disabled=true);$('#saveBtn').innerHTML=icon('clock')+'写真・日報を保存しています…';await persistDraft();try{const fd=new FormData;fd.set('data',JSON.stringify(raw));for(const k of ['work','bags'])if(S.photos[k])fd.set(k,await(await fetch(S.photos[k])).blob(),k+'.jpg');const r=await api(cpath()+'/records',{method:'POST',body:fd});try{await draftWrite(null)}catch{}S.dirty=false;S.saving=false;S.success=r;await go('list',undefined,true);toast(status==='final'?'写真つきの日報を保存しました':'下書きを保存しました')}catch(err){setError(err.message)}finally{S.saving=false;if($('#saveBtn'))$('#saveBtn').innerHTML=icon('save')+'日報を保存する';form.querySelectorAll('button').forEach(b=>b.disabled=false)}}
function renderDetail(){const r=S.records.find(x=>x.number===S.number);if(!r){renderList();return}$('#app').innerHTML='<div class="formwrap"><div class="formhead"><div><p class="eyebrow">FIELD NOTE / 記録の確認</p><h1>第 '+r.number+' 回の作業日報</h1><p class="sub">'+(r.status==='final'?'保存済み':'下書き')+' ・ '+e(S.contract.area)+'</p></div><button class="btn ghost" onclick="go(\'list\')">'+icon('back')+'一覧へ</button></div><section class="panel step"><h2>'+e(dateLabel(r.date))+'</h2><p>'+e(r.startTime||'未入力')+' 〜 '+e(r.endTime||'未入力')+'</p><div class="stats" style="margin:20px 0 0"><div class="stat"><div class="cap">作業者</div><div class="num">'+e(r.workers??'—')+'<span>名</span></div></div><div class="stat"><div class="cap">指導者</div><div class="num">'+e(r.guides??'—')+'<span>名</span></div></div><div class="stat"><div class="cap">ゴミ袋</div><div class="num">'+e(r.bags??'—')+'<span>袋</span></div></div></div></section><section class="panel step"><div class="sectiontop"><h2>報告写真</h2></div><div class="detailphotos">'+['work','bags'].map(k=>'<div><p class="sub" style="margin-bottom:8px">'+(k==='work'?'作業状況写真':'ごみ袋の写真')+'</p>'+(r.photos?.[k]?'<img src="'+apiBase()+cpath()+'/photo/'+r.number+'/'+k+'?v='+encodeURIComponent(r.updatedAt)+'" alt="'+(k==='work'?'作業状況写真':'ごみ袋の写真')+'">':'<div class="empty">写真未添付</div>')+'</div>').join('')+'</div></section><div class="row-actions"><button class="btn primary" onclick="startEntry('+r.number+')">'+icon('edit')+(r.status==='draft'?'入力を再開する':'日報を修正する')+'</button>'+(r.status==='final'?'<button class="btn" onclick="openReport(\''+r.number+'\')">'+icon('file')+'日報を印刷・PDF保存</button><a class="btn" href="'+reportLink(r.number,true)+'">帳票ファイルを保存</a>':'')+'</div><p class="hint">'+(r.status==='final'?'保存した帳票には、その時点の現場の情報を使用しています。':'下書きは頭紙と提出用の帳票には含まれません。')+'</p></div>'}
window.addEventListener('beforeunload',ev=>{if(S.dirty){ev.preventDefault();ev.returnValue=''}});window.addEventListener('online',()=>$('#offline').hidden=true);window.addEventListener('offline',()=>$('#offline').hidden=false);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S.dirty)persistDraft()});
async function init(){if(window.CLEANING_READY)try{await window.CLEANING_READY}catch(err){$('#app').innerHTML=errorHTML(err.message);return;}$('#today').textContent=new Date().toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'});$('#offline').hidden=navigator.onLine;try{S.contracts=await api('contracts');S.contract=S.contracts.find(c=>c.id===localStorage.getItem('cleaning.activeContract'))||S.contracts[0]||null;const hash=location.hash.slice(1).split('/');await go(['list','new','settings','entry','detail'].includes(hash[0])?hash[0]:'list',Math.min(30,Math.max(1,Number(hash[1])||1)),true)}catch(err){$('#app').innerHTML=errorHTML(err.message)+'<button class="btn" onclick="init()">再読み込み</button>'}}init();
</script></body></html>
